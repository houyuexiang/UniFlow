services:
  uniflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: uniflow
    restart: unless-stopped
    ports:
      - "5100:5100"
    volumes:
      - uniflow_config:/app/config
      - uniflow_logs:/app/logs
      - uniflow_data:/app/DisposeFile
      - uniflow_db:/app/uniflow_admin.db
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5100
      # 环境变量覆盖：路径用 "__"（双下划线）分隔，**无 UniFlow 前缀**
      # （应用未调用 AddEnvironmentVariables("UniFlow")，带前缀会变成死变量）
      # 当前配置根：Aptio / Aptio:Database / Features:Aptio / WebAdmin / DMS
      - Aptio__Database__Host=${MYSQL_HOST:-192.168.1.200}
      - Aptio__Database__Port=${MYSQL_PORT:-3306}
      - Aptio__Database__User=${MYSQL_USER:-root}
      - Aptio__Database__Password=${MYSQL_PASSWORD:-root}
      - Aptio__Database__Database=${MYSQL_DATABASE:-flexlab}
      - Aptio__Ip=${APTIO_IP:-192.168.1.200}
      - Aptio__Port=${APTIO_PORT:-2055}
      - Features__Aptio__DisposeSample=${APTIO_DISPOSE_SAMPLE:-true}
      - Features__Aptio__SrmExport=${APTIO_SRM_EXPORT:-true}
      - Features__Aptio__Delivery=${APTIO_DELIVERY:-false}
      - Features__Aptio__DeliveryFile=${APTIO_DELIVERY_FILE:-false}
      - Features__Aptio__Priority=${APTIO_PRIORITY:-false}
      - Features__Aptio__TestNameDispose=${APTIO_TEST_NAME_DISPOSE:-false}
      - WebAdmin__BindIp=0.0.0.0
      - WebAdmin__Port=5100

volumes:
  uniflow_config:
  uniflow_logs:
  uniflow_data:
  uniflow_db:
