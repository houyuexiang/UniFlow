<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFlow 管理控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>UniFlow</h1>
    <span class="subtitle">实验室自动化工作流服务</span>
    <div class="header-right">
      <span class="version-badge" id="appVersion">v?</span>
      <span class="status-badge" id="systemStatus">检查中...</span>
      <button onclick="refreshAll()" class="btn-icon" title="刷新">↻</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">仪表盘</button>
    <button class="tab" data-tab="errors">错误日志</button>
    <button class="tab" data-tab="config">配置管理</button>
    <button class="tab" data-tab="logs">日志文件</button>
  </nav>

  <main>
    <!-- Dashboard -->
    <section id="tab-dashboard" class="tab-content active">
      <div class="cards" id="healthCards">
        <div class="card loading">加载中...</div>
      </div>
      <div class="chart-area">
        <h3>健康历史</h3>
        <div class="chart-controls">
          <label>天数: <select id="healthDays" onchange="loadHealthHistory()">
            <option value="1">1天</option><option value="3" selected>3天</option>
            <option value="7">7天</option><option value="30">30天</option>
          </select></label>
        </div>
        <div class="chart" id="healthChart"><div class="loading">加载中...</div></div>
      </div>
    </section>

    <!-- Errors -->
    <section id="tab-errors" class="tab-content">
      <div class="chart-controls">
        <label>天数: <select id="errorDays" onchange="loadErrors()">
          <option value="1">1天</option><option value="3" selected>3天</option>
          <option value="7">7天</option><option value="30">30天</option>
        </select></label>
        <label>级别: <select id="errorLevel" onchange="loadErrors()">
          <option value="">全部</option><option value="ERROR">ERROR</option>
          <option value="FATAL">FATAL</option><option value="WARN">WARN</option>
        </select></label>
        <button class="btn-danger" onclick="clearAllErrors()">清除所有错误</button>
      </div>
      <div class="error-summary" id="errorSummary"></div>
      <table class="data-table" id="errorTable">
        <thead><tr><th>时间</th><th>模块</th><th>级别</th><th>消息</th></tr></thead>
        <tbody id="errorBody"></tbody>
      </table>
    </section>

    <!-- Config -->
    <section id="tab-config" class="tab-content">
      <div class="config-toolbar">
        <button onclick="loadConfig()" class="btn">刷新配置</button>
        <span class="config-hint">点击值可编辑</span>
      </div>
      <div id="configTree" class="config-tree"><div class="loading">加载中...</div></div>
    </section>

    <!-- Log Files -->
    <section id="tab-logs" class="tab-content">
      <div class="chart-controls">
        <label>范围: <select id="logDays" onchange="loadLogFiles()">
          <option value="1">1天</option><option value="3" selected>3天</option>
          <option value="7">7天</option><option value="30">30天</option>
        </select></label>
      </div>
      <div id="logFileList" class="log-file-list"><div class="loading">加载中...</div></div>
      <div class="log-viewer" id="logViewer" style="display:none">
        <h4 id="logViewerTitle"></h4>
        <pre id="logContent"></pre>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
